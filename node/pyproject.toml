[project]
name = "bird-frame-bridge"
version = "0.2.0"
description = "Bridge Python colocalisé avec BirdNET-Go : lit birdnet.db en lecture seule, pousse les détections vers le serveur bird-frame, relaie le bloc « en écoute », exécute les commandes de pilotage à distance."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
