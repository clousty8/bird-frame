# bird-frame — CI : validation avant fusion dans `main` (PR) et à chaque push sur `dev`.
#
# Cinq jobs indépendants et parallèles (server, node, web, versions, docker), agrégés par le
# job `test` : c'est lui, et lui seul, qu'on déclare comme "required status check" côté
# protection de branche GitHub de `main` — ajouter ou retirer un job ci-dessous ne demande donc
# pas de retoucher cette configuration à chaque fois (cf. .claude/skills/release/SKILL.md,
# étape 7, qui interroge `gh pr checks` en cherchant précisément le check `test`).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Installer sox (spectrogrammes testés pour de vrai)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sox

      - name: Installer les dépendances (verrouillées)
        run: uv sync --frozen

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check app tests

  node:
    name: node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: node/uv.lock

      - name: Installer les dépendances (verrouillées)
        run: uv sync --frozen

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check bridge tests

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances (verrouillées)
        run: npm ci

      - name: Tests (vitest)
        run: npm run test

      - name: Vérification des types (svelte-check)
        run: npm run check

      - name: Build (vite)
        run: npm run build

  versions:
    name: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vérifier que toutes les versions sont synchronisées avec VERSION
        run: python3 scripts/bump.py --check

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image (sans push — valide juste que le Dockerfile construit)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job agrégateur : c'est CE job qui doit être déclaré comme "required status check" dans la
  # protection de branche `main`. `needs` + `if: always()` : il tourne même si un job en amont a
  # échoué, pour échouer proprement à son tour — un job resté "skipped" ne bloquerait pas la PR.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [server, node, web, versions, docker]
    if: always()
    steps:
      - name: Échouer si un job amont a échoué ou a été annulé
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
