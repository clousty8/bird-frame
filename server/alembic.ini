[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Laissé vide : migrations/env.py résout l'URL depuis BIRDFRAME_DB_PATH (app/config.py)
# quand cette option n'est pas fournie explicitement (ce que fait `run_migrations()` au
# démarrage du serveur, pour pointer sur la base de l'app en cours plutôt que celle du .env).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
